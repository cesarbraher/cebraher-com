name: CI & Hostinger Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: Lint, Build & Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: bun install --frozen-lockfile || npm install --legacy-peer-deps

      - name: TypeScript typecheck (lint)
        run: npm run lint

      - name: Build production client & server bundle
        run: npm run build

      - name: Smoke test server & package hybrid Hostinger bundle
        run: |
          mkdir -p deploy-bundle/dist deploy-bundle/api deploy-bundle/database deploy-bundle/data
          cp -r dist/* deploy-bundle/
          cp -r dist/* deploy-bundle/dist/
          cp server.js package.json deploy-bundle/
          cp database/hostinger_schema.sql deploy-bundle/database/

          NODE_ENV=production PORT=3000 node server.js &
          SERVER_PID=$!
          READY=0
          for i in {1..15}; do
            if curl -fsS http://127.0.0.1:3000/api/status > deploy-bundle/api/status.json 2>/dev/null; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            echo "Server failed to respond on /api/status within 15s"
            kill $SERVER_PID || true
            exit 1
          fi

          curl -fsS "http://127.0.0.1:3000/api/posts?all=true" > deploy-bundle/api/posts.json
          curl -fsS "http://127.0.0.1:3000/api/categories" > deploy-bundle/api/categories.json
          curl -fsS "http://127.0.0.1:3000/api/projects" > deploy-bundle/api/projects.json
          curl -fsS "http://127.0.0.1:3000/api/blogger/config" > deploy-bundle/api/blogger-config.json
          if [ -f data/db.json ]; then
            cp data/db.json deploy-bundle/data/db.json
          fi

          kill $SERVER_PID || true

          cat > deploy-bundle/.htaccess <<'EOF'
          <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /

            # Serve pre-rendered JSON API endpoints when running on LiteSpeed static/shared hosting
            RewriteRule ^api/posts/?$ api/posts.json [L,T=application/json]
            RewriteRule ^api/categories/?$ api/categories.json [L,T=application/json]
            RewriteRule ^api/projects/?$ api/projects.json [L,T=application/json]
            RewriteRule ^api/status/?$ api/status.json [L,T=application/json]
            RewriteRule ^api/blogger/config/?$ api/blogger-config.json [L,T=application/json]

            # Serve existing files and directories directly
            RewriteCond %{REQUEST_FILENAME} -f [OR]
            RewriteCond %{REQUEST_FILENAME} -d
            RewriteRule ^ - [L]

            # SPA fallback to index.html
            RewriteRule ^ index.html [L]
          </IfModule>
          EOF

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: cebraher-production-build
          retention-days: 7
          include-hidden-files: true
          path: deploy-bundle/

  deploy-hostinger:
    name: Deploy to Hostinger (SSH)
    needs: build-and-verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Download production artifact
        uses: actions/download-artifact@v4
        with:
          name: cebraher-production-build
          path: ./deploy-bundle

      - name: Deploy via SSH to Hostinger (191.96.56.71:65002)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST || '191.96.56.71' }}
          SSH_PORT: ${{ secrets.SSH_PORT || '65002' }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME || 'u529127178' }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY || secrets.HOSTINGER_SSH_KEY }}
          EXPECTED_FP: "SHA256:BSTXlZnj3EfIH48wI20RyZG1C9kj3d6bjjBN54AdBME"
          CUSTOM_APP_DIR: ${{ secrets.HOSTINGER_APP_DIR || vars.HOSTINGER_APP_DIR }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::notice::SSH_PRIVATE_KEY secret is not configured yet in GitHub Actions. Skipping Hostinger SSH deploy."
            exit 0
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -p "$SSH_PORT" -t ed25519 "$SSH_HOST" > ~/.ssh/known_hosts 2>/dev/null
          ACTUAL_FP=$(ssh-keygen -lf ~/.ssh/known_hosts | awk '{print $2}')
          echo "Hostinger server ED25519 fingerprint: $ACTUAL_FP"
          if [ "$ACTUAL_FP" != "$EXPECTED_FP" ]; then
            echo "::error::Hostinger SSH host key fingerprint mismatch! Expected $EXPECTED_FP, got $ACTUAL_FP"
            exit 1
          fi

          TARGET_DIR="$CUSTOM_APP_DIR"
          if [ -z "$TARGET_DIR" ]; then
            TARGET_DIR="/home/u529127178/domains/cebraher.com/public_html"
          fi

          echo "Deploying to $SSH_USERNAME@$SSH_HOST:$TARGET_DIR ..."
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" "$SSH_USERNAME@$SSH_HOST" "mkdir -p \"$TARGET_DIR\""
          rsync -avz -e "ssh -i ~/.ssh/id_ed25519 -p $SSH_PORT" ./deploy-bundle/ "$SSH_USERNAME@$SSH_HOST:$TARGET_DIR/"

          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" "$SSH_USERNAME@$SSH_HOST" "
            export PATH=/opt/alt/alt-nodejs22/root/usr/bin:/opt/alt/alt-nodejs20/root/usr/bin:/opt/alt/alt-nodejs18/root/usr/bin:\$PATH
            cd \"$TARGET_DIR\"
            if command -v npm >/dev/null 2>&1; then
              echo \"Found npm at \$(command -v npm) (Node \$(node -v))\"
              npm install --omit=dev --legacy-peer-deps --ignore-scripts
            else
              echo \"LiteSpeed static/hybrid mode active (no system npm in CloudLinux PATH)\"
            fi
            mkdir -p tmp && touch tmp/restart.txt
          "
          echo "Deployment to Hostinger completed successfully!"
